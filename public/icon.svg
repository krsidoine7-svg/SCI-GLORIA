<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#050F1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond arrondi Deep Royal Navy -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Monogramme architectural "G" & Toiture BTP en Or Pur -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Toiture stylisée BTP au sommet -->
    <path d="M 32 10 L 46 20 L 41 20 L 32 13.5 L 23 20 L 18 20 Z"/>
    
    <!-- Lettre G architecturale puissante -->
    <path d="M 32 17 C 22.5 17 15 24 15 33.5 C 15 43 22.5 50 32 50 C 40.5 50 47 44.5 48.5 37 L 41 37 C 39.8 40.5 36.2 43.2 32 43.2 C 26 43.2 21.8 38.8 21.8 33.5 C 21.8 28.2 26 23.8 32 23.8 C 36 23.8 39.2 26 40.8 29.2 L 48 25.8 C 44.8 20.5 39 17 32 17 Z"/>
    
    <!-- Barre centrale intérieure du G (brique / linteau de construction) -->
    <rect x="33" y="31.5" width="15" height="5.5" rx="1"/>
  </g>
</svg>
